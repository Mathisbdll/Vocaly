<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site de test</title>
<style>
  :root { --bg:#f6f4ef; --fg:#1d1d1f; --accent:#ff5a36; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#f2f2f2; --card:#1f1f1f; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family: system-ui, -apple-system, sans-serif; padding:16px; }
  .card { background:var(--card); padding:32px; border-radius:16px; max-width:420px; width:100%; text-align:center;
          box-shadow:0 10px 30px rgba(0,0,0,.08); }
  h1 { margin:0 0 8px; font-size:1.8rem; }
  p { opacity:.7; margin:0 0 24px; }
  button { background:var(--accent); color:#fff; border:0; padding:14px 24px; border-radius:999px; font-size:1rem;
           cursor:pointer; transition:transform .1s; }
  button:active { transform:scale(.95); }
  #count { font-size:3rem; font-weight:700; margin:16px 0; }
  #msg { min-height:1.5em; }
</style>
</head>
<body>
  <main class="card">
    <h1>Site de test 🧪</h1>
    <p>Un truc nul, on s'en fout.</p>
    <div id="count">0</div>
    <button id="btn">Clique</button>
    <p id="msg"></p>
  </main>
<script>
  const msgs = ["Bravo.", "Encore ?", "T'as rien d'autre à faire ?", "Ok ça marche.", "Le site fonctionne 🎉", "Arrête.", "Sérieux."];
  let n = 0;
  document.getElementById('btn').onclick = () => {
    n++;
    document.getElementById('count').textContent = n;
    document.getElementById('msg').textContent = msgs[Math.floor(Math.random() * msgs.length)];
  };
</script>
</body>
</html>
